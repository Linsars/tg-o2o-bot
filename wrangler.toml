name = "tg-o2o-bot"
main = "worker.js"
workers_dev = true
compatibility_date = "2025-09-27"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "KV"

[[d1_databases]]
binding = "TG_O2O_DB"
database_name = "tg-o2o-bot-db"
database_id = ""

[env.production]
vars = { BOT_CONFIGS = "[]" }
